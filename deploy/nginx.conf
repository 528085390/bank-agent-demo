# 真机测试环境的入口：静态站 + /api 反代。
# 端口必须和 docker-compose.yml 里 web 服务的 "8088:8088" 一致。
server {
    listen 8088;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 全站 Basic Auth。后端本身没有登录（POST /api/session 谁都能领一个演示会话），
    # 不加这一层等于把模型额度挂在公网上白送。
    # 口令在 $STACK_DIR/secrets/basic_auth（deploy.sh 每次部署由它派生 htpasswd 挂进来）。
    auth_basic "Bank Agent";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 账单附件走 /api 上传，默认 1m 不够。
    client_max_body_size 32m;

    # 反代的公共设置放在 server 级，下面两个 /api location 继承。
    # 账单分析用 text/event-stream 推进度（backend/app/api/routes.py 的 StreamingResponse），
    # 开着缓冲的话前端要等到最后才收到全部内容，进度条等于没有。
    proxy_http_version 1.1;
    # `$host` 不含端口，而本站是 :8088 对外，浏览器发的 Origin 带端口。后端拿 Origin 和
    # Host 比来源，用 $host 就会把每个同源请求都判成跨站，所以这里改成 $http_host 原样透传。
    proxy_set_header Host $http_host;
    # 双保险：即使 Host 被别的中间层改掉，后端也会拿这个头当候选来源再比一次。
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # 模型一轮推理可能几十秒，默认 60s 会 504。
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 健康检查不设口令：deploy.sh 在服务器本机 curl 这个地址做部署判定，
    # 外部监控也用它，它们都拿不到 htpasswd。这里只回 status / model_configured / demo_mode。
    location = /api/health {
        auth_basic off;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Vite 产物带内容哈希，可以长缓存。
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 线上版本标记（镜像构建时烧进去的提交号），别让它被浏览器缓存。
    # 同样不设口令：核对线上版本时不想先去翻密码。
    location = /version.txt {
        auth_basic off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 单页应用：其余路径一律回 index.html，刷新子路由不会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
