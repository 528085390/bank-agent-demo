# %(here)s resolves the script location relative to this file, so migrations are
# found regardless of the working directory. Keep this file ASCII-only: configparser
# reads it with the platform locale codec, which is cp936 on this Windows host.
[alembic]
script_location = %(here)s/app/storage/migrations
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
