[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-agent-runtime"
version = "0.1.0"
description = "Framework A/B runtime, orchestration, and execution kernel"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.1,<3.2",
    "lark-oapi>=1.2.0,<2",
    "openai>=2,<3",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11.10",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.8,<3",
    "pypdf>=5.0,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "qrcode>=8.2",
    "redis>=5.0,<6",
    "reportlab>=4.0,<5",
    "sqlalchemy>=2.0.38,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# PDF 报告的中文字体是数据文件，不是 .py：setuptools 默认不会把它打进 wheel。
# 部署走的是源码树里的 editable 安装（deploy/Dockerfile 直接 COPY backend/），
# 所以线上不依赖这一条；写了它是因为「pip install 出来的包也应该能生成 PDF」。
[tool.setuptools.package-data]
"app.notification" = ["fonts/*.ttf", "fonts/*.txt", "fonts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
